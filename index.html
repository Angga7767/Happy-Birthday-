<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday!</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="lock-screen">
        <div class="lock-box">
            <h2>Enter the secret key to unlock your birthday surprise:</h2>
            <input type="password" id="password-input" placeholder="Our special date? Inside joke?">
            <button onclick="checkPassword()">Unlock</button>
            <p id="error-msg" class="hidden">Try again! Hint: It's something we said everyday!.</p>
        </div>
    </div>

   <main id="main-content" class="hidden">

    <!-- Page 1 -->
    <div id="page-1">
        <!-- ... your existing content ... -->
        <div class="nav-container">
            <button class="nav-btn" onclick="showPage(2)">Next Surprise ➔</button>
        </div>
    </div>

    <!-- Page 2 -->
    <div id="page-2" class="hidden">
        <!-- ... existing ... -->
        <div class="nav-container">
            <button class="nav-btn secondary-btn" onclick="showPage(1)">⬅ Back</button>
            <button class="nav-btn home-btn" onclick="showPage(1)">🏠 Home</button>
            <button class="nav-btn" onclick="showPage(3)">Next ➔</button>
        </div>
    </div>

    <!-- Page 3 -->
    <div id="page-3" class="hidden">
        <!-- ... existing ... -->
        <div class="nav-container">
            <button class="nav-btn secondary-btn" onclick="showPage(2)">⬅ Back</button>
            <button class="nav-btn home-btn" onclick="showPage(1)">🏠 Home</button>
        </div>
    </div>

</main>
    <script src="script.js"></script>
</body>
</html>
